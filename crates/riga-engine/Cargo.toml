[package]
name = "riga-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
riga-core = { path = "../riga-core" }
riga-market = { path = "../riga-market" }
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
