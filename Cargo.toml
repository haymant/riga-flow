[workspace]
resolver = "2"
members = [
  "crates/riga-core",
  "crates/riga-market",
  "crates/riga-engine",
  "crates/riga-cli",
  "crates/riga-risk",
  "crates/riga-scheduler",
  "crates/riga-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
