name: ci
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: make info
      - run: make check
      - name: Ensure adapters do not contain pricing kernels
        run: '! grep -R -nE "StandardNormal|knock_in_barrier|\.exp\(\)" crates/riga-cli/src'

  dependency-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Per-crate dependency allowlist + no-ui
        run: ./skills/riga-flow/scripts/dep_hygiene.sh
